<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430"><style>text{font:18px Arial,sans-serif;fill:#263241}.h{font-size:25px;font-weight:bold}.s{font-size:16px;fill:#687484}</style><rect width="1120" height="430" rx="12" fill="#f7f9fc"/><text x="30" y="48" class="h">3. Table view: track reading status</text><text x="30" y="86" class="s">Right-click → Reading Shelf → Reading status. Star / clock toggle importance and urgency.</text><rect x="30" y="112" width="1060" height="43" fill="#e5ebf4"/><text x="48" y="140">Title</text><text x="800" y="140">Reading Shelf</text><text x="48" y="192">A reading workflow for research</text><text x="48" y="247">A reference for the next session</text><text x="48" y="302">A key paper (independent importance)</text><rect x="800" y="168" width="122" height="33" rx="16" fill="#e3efff" stroke="#3971c7"/><text x="821" y="191">읽는 중</text><rect x="800" y="222" width="122" height="33" rx="16" fill="#e9f4e3" stroke="#578246"/><text x="811" y="245">읽을 예정</text><rect x="800" y="277" width="122" height="33" rx="16" fill="#fff0c7" stroke="#aa7b26"/><text x="839" y="300">중요</text><text x="30" y="359" class="s">Enable the Reading Shelf column from the table header menu if it is hidden.</text><text x="30" y="397" class="s">Local profile storage. Status is shared across collections; reading order is per collection.</text></svg>