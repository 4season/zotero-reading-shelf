<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="710" viewBox="0 0 1120 710"><style>text{font-family:Arial,sans-serif;fill:#263241}.small{font-size:16px}.label{font-size:19px;font-weight:bold}.muted{fill:#687484}.heading{font-size:26px;font-weight:bold}</style><rect width="1120" height="710" rx="14" fill="#f7f9fc"/><rect x="0" y="0" width="1120" height="72" fill="#eaf0f8"/><text x="28" y="45" class="heading">Reading Shelf</text><rect x="640" y="18" width="110" height="37" rx="7" fill="white" stroke="#3676e8"/><text x="666" y="43" class="small">Gallery</text><rect x="765" y="18" width="322" height="37" rx="7" fill="white" stroke="#bbc5d4"/><text x="780" y="43" class="small muted">All Fields &amp; Tags</text><text x="28" y="115" class="heading">1. Gallery → Reading order / priority</text><text x="28" y="149" class="small muted">Use + or drag a reference into the queue. Click to show related notes.</text><rect x="30" y="180" width="235" height="300" rx="6" fill="white" stroke="#3676e8" stroke-width="4"/><text x="49" y="222" class="small muted">DEMO RESEARCH JOURNAL</text><text x="49" y="268" class="label">A reading workflow</text><text x="49" y="298" class="label">for research</text><text x="49" y="337" class="small muted">Example Author · 2026</text><path d="M50 364h192 M50 380h192 M50 396h192 M50 412h192 M50 428h164" stroke="#c9d1dd" stroke-width="5"/><text x="30" y="512" class="label">A reading workflow for research</text><rect x="30" y="530" width="106" height="29" rx="14" fill="#e3efff" stroke="#3971c7"/><text x="49" y="550" class="small">읽는 중</text><rect x="292" y="180" width="236" height="258" rx="8" fill="#fff9df" stroke="#d2c18b"/><text x="309" y="211" class="small muted">Child note</text><text x="309" y="247" class="label">Questions to review</text><text x="309" y="287" class="small">Summarize the main question.</text><text x="309" y="319" class="small">Check the assumptions.</text><text x="309" y="351" class="small">Compare related findings.</tex