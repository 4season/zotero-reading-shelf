<!doctype html><html lang="en"><meta charset="utf-8"><title>Reading Shelf feature demo</title>
<link rel="stylesheet" href="../gallery.css"><style>
:root{color-scheme:light;--material-background:#fff;--fill-primary:#20242b;--fill-secondary:#606874;--fill-quinary:#f3f5f6;--accent-blue:#3676e8}
body{margin:0;font:15px system-ui;color:#20242b;background:white}.demo-toolbar{display:flex;align-items:center;gap:14px;padding:15px 24px;border-bottom:1px solid #ddd}.demo-toolbar img{width:32px}.demo-toolbar span{margin-left:auto;color:#707780;font-size:12px}.sl-gallery{position:relative;inset:auto;overflow:visible;padding:24px;--sl-card-gap:17px;--sl-column-width:176px}.sl-header{gap:16px}.sl-header h1{font-size:1.65em}.sl-gallery-controls{max-width:55%}.sl-description{margin:18px 0 24px}.paper{box-sizing:border-box;width:100%;height:100%;padding:20px 14px;background:white;color:#28333c;text-align:left;border-radius:4px}.paper small{font-size:8px;letter-spacing:.07em;color:#44837b}.paper h3{font:700 17px/1.3 Georgia;margin:22px 0 12px}.paper p{font:9px/1.6 Georgia}.paper hr{border:0;border-top:1px solid #c1ccc9}.paper .lines{height:90px;background:repeating-linear-gradient(transparent 0 6px,#d7dddf 6px 7px);margin-top:16px}.sl-matrix .sl-grid{gap:17px}.demo-note{padding:12px 24px;color:#66707c;font-size:12px;background:#f5f7f8}
</style>
<div class="demo-toolbar"><img src="../icons/reading-shelf.svg" alt=""><strong>Reading Shelf</strong><span id="demo-caption"></span></div><main class="sl-gallery"></main>
<script>window.prefs=new Map();window.Zotero={Prefs:{get:k=>prefs.get(k),set:(k,v)=>prefs.set(k,v)},CreatorTypes:{getPrimaryIDForType:()=>1},logError:console.error};</script>
<script src="../vendor/markdown-it.min.js"></script><script src="../vendor/katex.min.js"></script><script src="../description.js"></script><script src="../bootstrap.js"></script>
<script>
const args=new URLSearchParams(location.search),language=args.get('lang')==='ko'?'ko':'en',matrix=args.get('mode')!=='shelf';
prefs.set(PREF+'language',language);prefs.set(PREF+'matrixMode',matrix);prefs.set(PREF+'hideCardButtons',true);prefs.set(PREF+'hideSizeControl',true);prefs.set(PREF+'hideSortControl',true);prefs.set(PREF+'hideEmptyStatus',true);
document.querySelector('#demo-caption').textContent=language==='ko'?'기능 소개용 브라우저 화면 · 가상 자료':'Browser feature demo · synthetic references';
window.renderDescriptionMarkup=createDescriptionRenderer(markdownit,()=>katex);
const collection={id:1,libraryID:1,key:'DEMO',name:language==='ko'?'연구 읽기 계획':'Research reading plan',getChildItems:()=>[]};
const titles=['Neural population dynamics','Reliable signal processing','Learning from prediction errors','Methods and open questions'];
const items=titles.map((title,i)=>({id:i+1,key:'DEMO'+i,libraryID:1,isNote:()=>false,isRegularItem:()=>true,getNotes:()=>[],getAttachments:()=>[],getCollections:()=>[1],getDisplayTitle:()=>title,getCreators:()=>[{lastName:'Example et al.',creatorTypeID:1}],getField:()=> '2026',dateAdded:'2026-11-07'}));
Zotero.Collections={get:()=>collection};Zotero.Items={get:id=>items.find(x=>x.id===id)};
const memo=language==='ko'?'## 질문에서 다음 실험으로\n**읽기 목표**를 정리하고, 근거와 남은 질문을 함께 기록합니다.\n\n예측 오차: $\\delta_t = r_t + \\gamma V(s_{t+1}) - V(s_t)$':'## From questions to the next experiment\nKeep **reading goals**, evidence and open questions together.\n\nPrediction error: $\\delta_t = r_t + \\gamma V(s_{t+1}) - V(s_t)$';
prefs.set(preferenceKey(collection),JSON.stringify({order:['DEMO0','DEMO1','DEMO2'],description:memo}));
for(const [i,status] of [[0,'reading'],[1,'planned'],[2,'planned']])prefs.set(itemPref(items[i],'status'),status);
prefs.set(itemPref(items[0],'important'),true);prefs.set(itemPref(items[0],'urgent'),true);prefs.set(itemPref(items[1],'important'),true);
window.ZoteroPane={itemsView:{getSortedItems:()=>items,selectItems:async()=>1,getSelectedItems:()=>[],selection:{clearSelection(){}}}};
const view=new Gallery(window);view.collection=collection;view.gallery=document.querySelector('main');view.visibility={observe(){}};
view.sync=()=>{view.gallery.replaceChildren();view.render();decorate()};view.selectCard=async()=>1;windows.set('demo',view);
function decorate(){for(const [i,card] of [...view.cards.values()].entries()){
card.placeholder.hidden=true;const paper=document.createElement('div');paper.className='paper';const journal=document.createElement('small');journal.textContent='READING SHELF · DEMO PAPER';const title=document.createElement('h3');title.textContent=titles[i];const authors=document.createElement('p');authors.textContent='Example Author · 2026';const hr=document.createElement('hr');const abstract=document.createElement('p');abstract.textContent='ABSTRACT — A synthetic reference used to demonstrate reading order, priorities and local reading progress.';const lines=document.createElement('div');lines.className='lines';paper.append(journal,title,authors,hr,abstract,lines);card.cover.append(paper);const meter=document.createElement('progress');meter.max=100;meter.value=[42,12,0,0][i];card.progress.append(meter,view.element('span','',meter.value+'%'));
}}
view.render();decorate();
</script></html>
