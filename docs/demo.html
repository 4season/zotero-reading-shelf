<!doctype html><html lang="ko"><meta charset="utf-8"><title>Reading Shelf demo</title>
<link rel="stylesheet" href="../gallery.css"><style>
:root{color-scheme:light;--material-background:#fafbfc;--fill-primary:#20242b;--fill-secondary:#666c77;--fill-quinary:#eef0f3;--accent-blue:#3676e8}body{margin:0;font:15px -apple-system,BlinkMacSystemFont,sans-serif;color:#20242b;background:#fafbfc}header{display:flex;align-items:center;gap:12px;padding:16px 28px;background:#f0f2f5;border-bottom:1px solid #ddd}header span{flex:1}header input{width:240px;padding:7px;border:1px solid #bbb;border-radius:6px}.sl-gallery{position:relative;overflow:visible;padding:28px;--sl-column-width:205px;--sl-card-gap:20px}.sl-cover .paper{box-sizing:border-box;width:100%;height:100%;padding:25px 16px;background:#fff;text-align:left;color:#273341}.paper b{display:block;font:700 18px Georgia;margin:20px 0}.paper p{font:11px/1.7 Georgia}.caption{padding:10px 28px;background:#eaf1ff}.sl-status-control{font-size:13px}.sl-child-card{flex-basis:205px}h1{font-size:27px}.sl-grid{gap:20px}
</style>
<header><strong>Reading Shelf</strong><span></span><button class="sl-toggle">Table</button><input placeholder="All Fields & Tags"></header>
<div class="caption">사용 안내용 데모 · 실제 라이브러리 화면이 아닌 가상 자료입니다.</div>
<main class="sl-gallery"><h1>Research reading plan</h1><p>읽을 순서를 정하고, 논문 옆에서 관련 노트를 열어보세요.</p><section class="sl-section"><h2>Reading order</h2><div class="sl-grid" id="cards"></div></section><section class="sl-section"><h2>처음 추가할 때도 놓일 공간을 확인하세요</h2><div class="sl-grid"><div class="sl-drop-placeholder" style="min-height:240px">여기에 놓아 읽기 목록에 추가</div></div></section></main>
<script>const Zotero={Prefs:{get:()=>undefined},CreatorTypes:{},logError:console.error};</script><script src="../bootstrap.js"></script>
<script>
const view=new Gallery({document,DOMParser,ZoteroPane:{}});view.collection={id:1};
const item={id:1,key:'DEMO',libraryID:1,isNote:()=>false,isRegularItem:()=>true,getNotes:()=>[],getAttachments:()=>[],getDisplayTitle:()=> 'A practical guide to research reading'};
const card=view.makeCard(item,'Example et al.');card.order.textContent='−';card.statusControl.value='reading';card.statusControl.className='sl-status-control sl-status-reading';card.placeholder.hidden=true;
const paper=document.createElement('div');paper.className='paper';paper.innerHTML='<small>DEMO RESEARCH JOURNAL</small><b>A practical guide to research reading</b><p>Example Author · 2026</p><hr><p>Abstract<br>This illustrative paper is a synthetic example for the Reading Shelf user guide.</p><p>Build a reading queue. Keep related notes close to each reference. Review your progress at a glance.</p>';card.cover.append(paper);document.querySelector('#cards').append(card.node);view.markSelected(card,true);
const note={id:2,key:'NOTE',isNote:()=>true,isRegularItem:()=>false,getNoteTitle:()=> 'Questions for the next reading session',getNote:()=> '<p>Summarize the main question.</p><p>Which assumptions should we check?</p><p>Compare the result with a related paper.</p>'};document.querySelector('#cards').append(view.makeCard(note,'',true).node);
const second=view.makeCard({...item,id:3,key:'NEXT',getDisplayTitle:()=> 'Next paper to review'},'Sample and Demo');second.statusControl.value='important';second.statusControl.className='sl-status-control sl-status-important';second.order.textContent='+';document.querySelector('#cards').append(second.node);
</script></html>
