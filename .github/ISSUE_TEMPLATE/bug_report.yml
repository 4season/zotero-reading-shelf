name: Bug report / 버그 제보
description: Something does not work as expected. 기대와 다르게 동작합니다.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! You can write in **English or Korean (한국어)**. 영어와 한국어 모두 괜찮습니다.
        Please do not include private information such as your library contents or file paths you want to keep private. 개인 정보가 담긴 내용은 올리지 말아 주세요.
  - type: input
    id: plugin-version
    attributes:
      label: Reading Shelf version / 플러그인 버전
      description: Tools → Plugins → Reading Shelf. 도구 → 플러그인에서 확인할 수 있습니다.
      placeholder: "1.3.8"
    validations:
      required: true
  - type: input
    id: zotero-version
    attributes:
      label: Zotero version / Zotero 버전
      placeholder: "10.0.8"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system / 운영체제
      description: The plugin has been checked on macOS and Windows 11 so far, so Linux reports and other setups are especially helpful. 지금까지 macOS와 Windows 11에서 확인했으므로 Linux와 다른 환경의 제보가 특히 도움이 됩니다.
      options:
        - macOS
        - Windows
        - Linux
        - Other / 기타
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened? / 무슨 일이 있었나요?
      description: What did you see, and what did you expect instead? 무엇을 보셨고, 어떻게 동작하길 기대하셨나요?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 재현 방법
      placeholder: |
        1. Open a collection and click Gallery
        2. ...
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording / 스크린샷·화면 녹화
      description: Drag files here. A short recording of the moment is very helpful for animation or layout problems. 애니메이션이나 레이아웃 문제는 짧은 녹화가 큰 도움이 됩니다.
