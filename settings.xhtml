<groupbox id="sl-settings">
  <label><html:h2>Reading Shelf</html:h2></label>
  <hbox align="center"><label value="언어 / Language"/>
    <menulist preference="extensions.syllabus-lite.language" id="sl-language"><menupopup>
      <menuitem label="한국어" value="ko"/><menuitem label="English" value="en"/>
    </menupopup></menulist>
  </hbox>
  <checkbox data-sl-en="Hide reading-order + / − buttons" data-sl-ko="읽기 목록 + / − 버튼 숨기기" preference="extensions.syllabus-lite.hideCardButtons"/>
  <checkbox data-sl-en="Hide child notes / attachments indicator" data-sl-ko="부속 노트 / 첨부파일 표시 숨기기" preference="extensions.syllabus-lite.hideChildIndicator"/>
  <checkbox data-sl-en="Hide the card size slider" data-sl-ko="자료 크기 슬라이더 숨기기" preference="extensions.syllabus-lite.hideSizeControl"/>
  <checkbox data-sl-en="Hide the sort menu" data-sl-ko="정렬 메뉴 숨기기" preference="extensions.syllabus-lite.hideSortControl"/>
  <checkbox data-sl-en="Hide empty status until hover or keyboard focus" data-sl-ko="상태 없음은 마우스를 올리거나 키보드로 선택할 때만 표시" preference="extensions.syllabus-lite.hideEmptyStatus"/>
  <checkbox data-sl-en="Eisenhower mode: two important-material lanes" data-sl-ko="아이젠하워 모드: 중요한 자료를 2열로 분류" preference="extensions.syllabus-lite.matrixMode"/>
  <description data-sl-en="Left: urgent and important. Right: important, not urgent. Other items remain below. Use the star and clock controls, or drag into a lane. Reading status is independent of importance and urgency. Changes apply immediately." data-sl-ko="왼쪽: 긴급하고 중요한 자료. 오른쪽: 중요하지만 덜 급한 자료. 나머지는 아래에 표시됩니다. 별 / 시계 버튼이나 드래그로 분류하세요. 읽기 상태는 중요도·긴급도와 독립적이며, 설정은 바로 적용됩니다."/>
</groupbox>
